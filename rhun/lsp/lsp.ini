# rhun-editor/lsp server commands. Copy (not symlink: the extension's sandbox can't read
# outside its state folder) to ~/.local/state/rhun/extensions/rhun-editor--lsp/lsp.ini.
# The sandbox only lets the extension exec the programs it names, so no /usr/bin/env
# wrappers here: servers run by absolute path and inherit rhun's PATH, which must contain
# go (see `launchctl setenv PATH`). Apply with "Restart Language Servers".

[servers]
Go = /Users/shubham.dogra/go/bin/gopls
Python = /Users/shubham.dogra/.local/bin/ty server
